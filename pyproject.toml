[project]
name = "standalone-coding-agent"
version = "0.1.0"
description = "Experimental offline preflight for a provider-agnostic coding agent"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
